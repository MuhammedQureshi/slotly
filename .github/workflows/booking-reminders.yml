name: Booking reminders

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Slotly reminders
        env:
          CRON_SECRET: ${{ secrets.SLOTLY_CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail --show-error --silent --retry 2 \
            --header "Authorization: Bearer $CRON_SECRET" \
            https://slotly-kohl.vercel.app/api/cron/reminders
